<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAM GAMES 🎮</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at top left, #202b55, transparent 35%),
                radial-gradient(circle at top right, #321b4f, transparent 30%),
                #080b14;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            padding: 70px 20px 45px;
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 48px;
            letter-spacing: 5px;
            margin-bottom: 12px;
        }

        header p {
            color: #9da8c7;
            font-size: 18px;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: auto;
            padding-bottom: 60px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
        }

        /* =========================
           GAME GRID
        ========================= */

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 25px;
        }

        .game-card {
            background: rgba(20, 27, 48, 0.85);
            border: 1px solid #293555;
            border-radius: 20px;
            overflow: hidden;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-8px);

            border-color: #42c8ff;

            box-shadow:
                0 15px 50px rgba(
                    0,
                    170,
                    255,
                    0.15
                );
        }

        .game-cover {
            height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 75px;

            background:
                linear-gradient(
                    135deg,
                    #121a32,
                    #26345e
                );
        }

        .game-info {
            padding: 22px;
        }

        .game-info h3 {
            font-size: 22px;
            margin-bottom: 9px;
        }

        .game-info p {
            color: #929dbb;
            margin-bottom: 20px;
            min-height: 22px;
        }

        .play-btn {
            width: 100%;

            border: none;
            border-radius: 12px;

            padding: 13px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #00aaff,
                    #694cff
                );

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.03);

            box-shadow:
                0 8px 25px rgba(
                    80,
                    150,
                    255,
                    0.35
                );
        }

        /* =========================
           GAME PLAYER
        ========================= */

        #gamePage {
            display: none;

            width: 94%;
            max-width: 1400px;

            margin: auto;

            padding-bottom: 40px;
        }

        .game-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 15px;

            flex-wrap: wrap;
        }

        .game-title {
            font-size: 26px;
            font-weight: bold;
        }

        .game-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            border: 1px solid #344263;

            background: #151d34;

            color: white;

            padding: 10px 15px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;
        }

        .control-btn:hover {
            background: #202b4a;
        }

        .back-btn {
            background:
                linear-gradient(
                    135deg,
                    #ff4757,
                    #d63031
                );

            border: none;
        }

        .game-frame {
            width: 100%;

            height: 75vh;

            min-height: 500px;

            background: #000;

            border: 1px solid #303b5c;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 20px 70px rgba(
                    0,
                    0,
                    0,
                    0.45
                );
        }

        iframe {
            width: 100%;
            height: 100%;

            border: none;

            background: white;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 30px;

            color: #66718e;

            border-top: 1px solid #1c2540;

            margin-top: 30px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding-top: 45px;
            }

            header h1 {
                font-size: 35px;
            }

            .logo {
                font-size: 50px;
            }

            .game-frame {
                height: 70vh;
                min-height: 400px;
            }

            .game-title {
                font-size: 21px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         HOME PAGE
    ========================= -->

    <div id="homePage">

        <header>

            <div class="logo">
                🎮
            </div>

            <h1>
                RAM GAMES
            </h1>

            <p>
                بازی‌های ساخته شده توسط RAM
            </p>

        </header>


        <main class="container">

            <h2 class="section-title">
                🎮 بازی‌ها
            </h2>


            <div class="games">


                <!-- GAME 1 -->

                <div class="game-card">

                    <div class="game-cover">
                        🧙
                    </div>

                    <div class="game-info">

                        <h3>
                            GAME FOR KASRA
                        </h3>

                        <p>
                            یک بازی مخصوص کسری
                        </p>

                        <button
                            class="play-btn"
                            onclick="openGame(
                                'GAME FOR KASRA.html',
                                'GAME FOR KASRA'
                            )"
                        >
                            ▶ بازی کردن
                        </button>

                    </div>

                </div>


                <!-- GAME 2 -->

                <div class="game-card">

                    <div class="game-cover">
                        🐱
                    </div>

                    <div class="game-info">

                        <h3>
                            Jelly Cat
                        </h3>

                        <p>
                            Jelly Cat Adventure
                        </p>

                        <button
                            class="play-btn"
                            onclick="openGame(
                                'Jelly cat.html',
                                'Jelly Cat'
                            )"
                        >
                            ▶ بازی کردن
                        </button>

                    </div>

                </div>


                <!-- GAME 3 -->

                <div class="game-card">

                    <div class="game-cover">
                        ⛏️
                    </div>

                    <div class="game-info">

                        <h3>
                            MINECRAFT RUN
                        </h3>

                        <p>
                            Minecraft Run
                        </p>

                        <button
                            class="play-btn"
                            onclick="openGame(
                                'MINECRAFT RUN.html',
                                'Minecraft Run'
                            )"
                        >
                            ▶ بازی کردن
                        </button>

                    </div>

                </div>


                <!-- GAME 4 -->

                <div class="game-card">

                    <div class="game-cover">
                        🖱️
                    </div>

                    <div class="game-info">

                        <h3>
                            Minecraft Click
                        </h3>

                        <p>
                            یک بازی کلیکی
                        </p>

                        <button
                            class="play-btn"
                            onclick="openGame(
                                'Minecraft Click.html',
                                'Minecraft Click'
                            )"
                        >
                            ▶ بازی کردن
                        </button>

                    </div>

                </div>


                <!-- GAME 5 -->

                <div class="game-card">

                    <div class="game-cover">
                        🏎️
                    </div>

                    <div class="game-info">

                        <h3>
                            MMO RACE
                        </h3>

                        <p>
                            مسابقه‌ای سریع و هیجان‌انگیز
                        </p>

                        <button
                            class="play-btn"
                            onclick="openGame(
                                '☁️ MMO RACE ☁️.html',
                                'MMO RACE'
                            )"
                        >
                            ▶ بازی کردن
                        </button>

                    </div>

                </div>


            </div>

        </main>


        <footer>

            ساخته شده با ❤️ توسط RAM

        </footer>

    </div>



    <!-- =========================
         GAME PAGE
    ========================= -->

    <section id="gamePage">

        <div class="game-header">

            <div
                class="game-title"
                id="gameTitle"
            >
                بازی
            </div>


            <div class="game-buttons">

                <button
                    class="control-btn back-btn"
                    onclick="goHome()"
                >
                    ↩ بازگشت
                </button>


                <button
                    class="control-btn"
                    onclick="openNewTab()"
                >
                    ↗ تب جدید
                </button>


                <button
                    class="control-btn"
                    onclick="fullscreenGame()"
                >
                    ⛶ تمام صفحه
                </button>

            </div>

        </div>


        <div class="game-frame">

            <iframe
                id="gameFrame"
                allowfullscreen
                allow="fullscreen"
            ></iframe>

        </div>

    </section>



    <script>

        let currentGame = "";


        /* =========================
           OPEN GAME
        ========================= */

        function openGame(file, title) {

            currentGame = file;

            document.getElementById(
                "homePage"
            ).style.display = "none";


            document.getElementById(
                "gamePage"
            ).style.display = "block";


            document.getElementById(
                "gameTitle"
            ).textContent = "🎮 " + title;


            document.getElementById(
                "gameFrame"
            ).src = encodeURI(file);


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            history.pushState(
                {
                    game: file
                },
                "",
                "#game"
            );
        }



        /* =========================
           BACK HOME
        ========================= */

        function goHome() {

            document.getElementById(
                "gameFrame"
            ).src = "";


            document.getElementById(
                "gamePage"
            ).style.display = "none";


            document.getElementById(
                "homePage"
            ).style.display = "block";


            history.pushState(
                {},
                "",
                window.location.pathname
            );


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }



        /* =========================
           NEW TAB
        ========================= */

        function openNewTab() {

            if (!currentGame) {
                return;
            }

            window.open(
                encodeURI(currentGame),
                "_blank"
            );
        }



        /* =========================
           FULLSCREEN
        ========================= */

        function fullscreenGame() {

            const frame =
                document.getElementById(
                    "gameFrame"
                );


            if (frame.requestFullscreen) {

                frame.requestFullscreen();

            } else if (
                frame.webkitRequestFullscreen
            ) {

                frame.webkitRequestFullscreen();

            }
        }



        /* =========================
           BROWSER BACK BUTTON
        ========================= */

        window.addEventListener(
            "popstate",
            function() {

                goHome();

            }
        );

    </script>

</body>
</html>
