<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAM GAMES</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#faf9f6;
    color:#292621;
    font-family:Tahoma,Arial,sans-serif;
}

.page{
    width:calc(100% - 30px);
    max-width:1500px;
    min-height:calc(100vh - 30px);
    margin:15px auto;
    padding:28px;
    background:#fff;
    border:1px solid #f0dfc2;
    border-radius:28px;
    box-shadow:0 10px 40px rgba(170,110,20,.08);
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:35px;
}

.logo h1{
    margin:0;
    color:#c47d0d;
    font-size:42px;
}

.logo p{
    margin:7px 0 0;
    color:#a89370;
}

.admin-btn{
    padding:12px 18px;
    border-radius:12px;
    border:1px solid #e8d2aa;
    background:#fffaf1;
    color:#b86f09;
    cursor:pointer;
}

.admin-btn:hover{
    background:#fff0d5;
}

/* GAMES */

.title{
    color:#c47d0d;
    margin-bottom:20px;
}

.games{
    display:grid;
    grid-template-columns:repeat(
        auto-fit,
        minmax(250px,1fr)
    );
    gap:22px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    border:1px solid #eedfc8;
    background:#fffdfa;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(150,100,20,.12);
}

/* COVER */

.cover{
    width:100%;
    height:170px;
    background:#f5ead7;
    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* CARD */

.card-content{
    padding:17px;
}

.card h2{
    margin:0 0 8px;
    color:#a96508;
    font-size:19px;
}

.card p{
    color:#918a80;
    font-size:13px;
    min-height:35px;
}

.play{
    width:100%;
    padding:12px;
    border:none;
    border-radius:11px;
    background:#c47d0d;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.play:hover{
    background:#a96808;
}

.badge{
    position:absolute;
    top:10px;
    right:10px;
    background:#222;
    color:white;
    padding:6px 9px;
    border-radius:9px;
    font-size:11px;
    z-index:5;
}

.disabled{
    opacity:.55;
    filter:grayscale(1);
}

/* GAME PAGE */

#gamePage,
#adminPage{
    display:none;
}

.game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:15px;
}

.game-title{
    color:#c47d0d;
    font-size:28px;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action{
    border:1px solid #e4d2ae;
    background:#fff9ee;
    color:#9d650c;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

.action:hover{
    background:#fff0d5;
}

.back{
    background:#c47d0d;
    color:white;
    border-color:#c47d0d;
}

/* GAME */

.game-container{
    width:100%;
    height:78vh;
    min-height:500px;
    border:1px solid #ead9ba;
    border-radius:20px;
    overflow:hidden;
    background:white;
}

#gameFrame{
    width:100%;
    height:100%;
    border:none;
    display:block;
}

/* ADMIN */

.admin-panel{
    background:#fffdfa;
    border:1px solid #eedfc8;
    border-radius:20px;
    padding:22px;
}

.admin-panel h2{
    color:#c47d0d;
}

.admin-games{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
    margin-top:20px;
}

.admin-game{
    border:1px solid #eadcc7;
    border-radius:15px;
    padding:15px;
    background:white;
}

.admin-game h3{
    color:#a96508;
    margin-top:0;
}

.admin-game button{
    padding:8px 12px;
    border-radius:9px;
    border:1px solid #dfcda9;
    background:#fff8eb;
    color:#8d5a09;
    cursor:pointer;
    margin:3px;
}

footer{
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid #f0e5d2;
    text-align:center;
    color:#a79c8b;
    font-size:12px;
}

/* MOBILE */

@media(max-width:650px){

    .page{
        width:calc(100% - 12px);
        padding:18px;
    }

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .logo h1{
        font-size:32px;
    }

    .game-container{
        height:72vh;
        min-height:400px;
    }

}

</style>

</head>


<body>

<div class="page">


<!-- =========================
     HOME
========================= -->

<section id="homePage">

<header>

<div class="logo">

<h1>
RAM GAMES
</h1>

<p>
مجموعه بازی‌های RAM
</p>

</div>


<button
class="admin-btn"
onclick="adminLogin()"
>
مدیریت بازی‌ها
</button>

</header>


<h2 class="title">
بازی‌ها
</h2>


<div
id="games"
class="games">
</div>


<footer>
RAM GAMES — ساخته شده توسط RAM
</footer>

</section>



<!-- =========================
     GAME PAGE
========================= -->

<section id="gamePage">


<div class="game-top">


<div
id="gameTitle"
class="game-title"
>
GAME
</div>


<div class="buttons">


<button
class="action back"
onclick="home()"
>
بازگشت
</button>


<button
class="action"
onclick="newTab()"
>
باز کردن در تب جدید
</button>


<button
class="action"
onclick="focusGame()"
>
فعال‌سازی کنترل
</button>


<button
class="action"
onclick="fullscreen()"
>
تمام صفحه
</button>


</div>

</div>


<div
class="game-container"
onclick="focusGame()"
>

<iframe
id="gameFrame"
tabindex="0"
allowfullscreen
allow="fullscreen"
>
</iframe>

</div>


<p
style="
text-align:center;
color:#999;
font-size:12px;
"
>
برای بازی‌های کیبوردی داخل صفحه بازی کلیک کن یا «فعال‌سازی کنترل» را بزن.
</p>


</section>



<!-- =========================
     ADMIN PAGE
========================= -->

<section id="adminPage">


<div class="game-top">


<h2 style="color:#c47d0d">
مدیریت RAM GAMES
</h2>


<div class="buttons">


<button
class="action back"
onclick="home()"
>
بازگشت
</button>


<button
class="action"
onclick="logout()"
>
خروج
</button>


</div>

</div>


<div class="admin-panel">


<h2>
کنترل بازی‌ها
</h2>


<p>
از اینجا می‌توانی هر بازی را قفل یا از دسترس خارج کنی.
</p>


<div
id="adminGames"
class="admin-games"
>
</div>


</div>


</section>


</div>



<script>


/* =====================================================
   GAME LIST
===================================================== */

const games = [

{
    name:"Halloween Hunt",
    file:"Halloween Hunt.html",
    img:"cover1.jpg"
},

{
    name:"Glider",
    file:"Glider.html",
    img:"cover2.jpg"
},

{
    name:"Doodle Jump",
    file:"Doodle Jump.html",
    img:"cover3.jpg"
},

{
    name:"Cube 3D",
    file:"Cube 3D.html",
    img:"cover4.jpg"
},

{
    name:"MMO RACE",
    file:"MMO RACE.html",
    img:"cover5.jpg"
},

{
    name:"Jelly Cat",
    file:"Jelly cat.html",
    img:"cover6.jpg"
},

{
    name:"Ball Climb",
    file:"Ball Climb.html",
    img:"cover7.jpg"
},

{
    name:"Minecraft Click",
    file:"Minecraft Click.html",
    img:"cover8.jpg"
},

{
    name:"GAME FOR KASRA",
    file:"GAME FOR KASRA.html",
    img:"cover1.jpg"
},

{
    name:"Minecraft Run",
    file:"MINECRAFT RUN.html",
    img:"cover2.jpg"
},

{
    name:"Blox Flip",
    file:"Blox Flip.html",
    img:"cover3.jpg"
}

];


/* =====================================================
   SETTINGS
===================================================== */

let settings =
JSON.parse(
localStorage.getItem(
"RAM_GAMES_SETTINGS"
) || "{}"
);


let admin =
JSON.parse(
localStorage.getItem(
"RAM_GAMES_ADMIN"
) || "null"
);


let currentGame = null;



/* =====================================================
   SAVE
===================================================== */

function save(){

localStorage.setItem(
"RAM_GAMES_SETTINGS",
JSON.stringify(settings)
);

}



/* =====================================================
   RENDER GAMES
===================================================== */

function renderGames(){

const box =
document.getElementById("games");

box.innerHTML="";


games.forEach(
(game,index)=>{


let locked =
settings[index]?.lock;

let disabled =
settings[index]?.disabled;


let card =
document.createElement("div");


card.className =
"card " +
(disabled ? "disabled" : "");


card.innerHTML = `

${
locked && !disabled
?
'<div class="badge">قفل شده</div>'
:
""
}


${
disabled
?
'<div class="badge">خارج از دسترس</div>'
:
""
}


<div class="cover">

<img
src="${game.img}"
alt="${game.name}"
onerror="
this.style.display='none';
this.parentElement.innerHTML=
'<div style=
'height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#c47d0d;
font-weight:bold;'>
${game.name}
</div>'
"
>

</div>


<div class="card-content">


<h2>
${game.name}
</h2>


<p>

${
disabled
?
"این بازی فعلاً در دسترس نیست."

:
locked
?
"برای ورود رمز لازم است."

:
"برای اجرای بازی کلیک کن."
}

</p>


<button
class="play"
onclick="playGame(${index})"
>

${
disabled
?
"در دسترس نیست"
:
locked
?
"ورود با رمز"
:
"بازی کردن"
}

</button>


</div>

`;


box.appendChild(card);

});

}



/* =====================================================
   PLAY
===================================================== */

function playGame(index){


if(
settings[index]?.disabled
){

alert(
"این بازی فعلاً توسط مدیر از دسترس خارج شده است."
);

return;

}


if(
settings[index]?.lock
){

let password =
prompt(
"رمز این بازی را وارد کنید:"
);


if(
password !==
settings[index].lock
){

if(password !== null){

alert(
"رمز اشتباه است."
);

}

return;

}

}


openGame(index);

}



/* =====================================================
   OPEN GAME
===================================================== */

function openGame(index){

currentGame=index;


document.getElementById(
"homePage"
).style.display="none";


document.getElementById(
"adminPage"
).style.display="none";


document.getElementById(
"gamePage"
).style.display="block";


document.getElementById(
"gameTitle"
).textContent=
games[index].name;


let frame =
document.getElementById(
"gameFrame"
);


frame.src =
encodeURI(
games[index].file
);


window.scrollTo(
0,
0
);


setTimeout(
focusGame,
500
);

}



/* =====================================================
   KEYBOARD FOCUS
===================================================== */

function focusGame(){

let frame =
document.getElementById(
"gameFrame"
);


try{

frame.focus();

frame.contentWindow.focus();

}catch(e){}

}



/* =====================================================
   FULLSCREEN
===================================================== */

function fullscreen(){

let frame =
document.getElementById(
"gameFrame"
);


if(
frame.requestFullscreen
){

frame.requestFullscreen();

}

else if(
frame.webkitRequestFullscreen
){

frame.webkitRequestFullscreen();

}

}



/* =====================================================
   NEW TAB
===================================================== */

function newTab(){

if(
currentGame !== null
){

window.open(
encodeURI(
games[currentGame].file
),
"_blank"
);

}

}



/* =====================================================
   HOME
===================================================== */

function home(){

document.getElementById(
"gameFrame"
).src="";


document.getElementById(
"gamePage"
).style.display="none";


document.getElementById(
"adminPage"
).style.display="none";


document.getElementById(
"homePage"
).style.display="block";


currentGame=null;


renderGames();


window.scrollTo(
0,
0
);

}



/* =====================================================
   ADMIN LOGIN
===================================================== */

function adminLogin(){


/*
FIRST ADMIN
*/

if(!admin){

let name =
prompt(
"نام مدیر را وارد کنید:"
);

if(!name)return;


let email =
prompt(
"ایمیل مدیر:"
);

if(!email)return;


let password =
prompt(
"رمز مدیر:"
);

if(!password)return;


admin={

name:name,

email:email,

password:password

};


localStorage.setItem(
"RAM_GAMES_ADMIN",
JSON.stringify(admin)
);


alert(
"حساب مدیر ساخته شد."
);


renderAdmin();


return;

}


/*
ADMIN LOGIN
*/

let email =
prompt(
"ایمیل مدیر:"
);


let password =
prompt(
"رمز مدیر:"
);


if(
email === admin.email &&
password === admin.password
){

renderAdmin();

}

else{

alert(
"ایمیل یا رمز اشتباه است."
);

}

}



/* =====================================================
   ADMIN PANEL
===================================================== */

function renderAdmin(){


document.getElementById(
"homePage"
).style.display="none";


document.getElementById(
"gamePage"
).style.display="none";


document.getElementById(
"adminPage"
).style.display="block";


let box =
document.getElementById(
"adminGames"
);


box.innerHTML="";


games.forEach(
(game,index)=>{


let locked =
settings[index]?.lock;


let disabled =
settings[index]?.disabled;


let item =
document.createElement(
"div"
);


item.className=
"admin-game";


item.innerHTML=`

<h3>
${game.name}
</h3>


<button
onclick="lockGame(${index})"
>

${
locked
?
"تغییر رمز"
:
"قفل کردن"
}

</button>


${
locked
?
`
<button
onclick="unlockGame(${index})"
>
برداشتن قفل
</button>
`
:
""
}


<button
onclick="disableGame(${index})"
>

${
disabled
?
"فعال کردن بازی"
:
"خارج کردن از دسترس"
}

</button>

`;


box.appendChild(item);

});

}



/* =====================================================
   LOCK
===================================================== */

function lockGame(index){

let password =
prompt(
"رمز این بازی را وارد کنید:"
);


if(!password)return;


settings[index]={

...(settings[index] || {}),

lock:password

};


save();

renderAdmin();

renderGames();

}



/* =====================================================
   UNLOCK
===================================================== */

function unlockGame(index){

if(
confirm(
"قفل این بازی برداشته شود؟"
)
){

settings[index]={
...(settings[index] || {})
};


delete settings[index].lock;


save();

renderAdmin();

renderGames();

}

}



/* =====================================================
   DISABLE
===================================================== */

function disableGame(index){

settings[index]={

...(settings[index] || {}),

disabled:
!settings[index]?.disabled

};


save();

renderAdmin();

renderGames();

}



/* =====================================================
   LOGOUT
===================================================== */

function logout(){

home();

}



/* =====================================================
   START
===================================================== */

renderGames();

</script>

</body>

</html>
