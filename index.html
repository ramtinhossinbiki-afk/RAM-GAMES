<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAM GAMES 🎮</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at 10% 0%, #263867 0%, transparent 35%),
                radial-gradient(circle at 90% 0%, #40205c 0%, transparent 30%),
                #080b14;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           HOME
        ========================= */

        #homePage {
            display: block;
        }

        header {
            text-align: center;
            padding: 70px 20px 50px;
        }

        .logo {
            font-size: 70px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        header h1 {
            font-size: 50px;
            letter-spacing: 5px;
            margin-bottom: 12px;
        }

        header p {
            color: #9ca8c5;
            font-size: 18px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: auto;
            padding-bottom: 60px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 28px;
        }

        /* =========================
           GAME CARDS
        ========================= */

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 25px;
        }

        .game-card {
            background: rgba(19, 27, 48, 0.9);
            border: 1px solid #2d3a5e;
            border-radius: 20px;
            overflow: hidden;

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                border-color 0.25s;
        }

        .game-card:hover {
            transform: translateY(-8px);

            border-color: #39c5ff;

            box-shadow:
                0 20px 50px rgba(
                    0,
                    180,
                    255,
                    0.16
                );
        }

        .game-cover {
            height: 190px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 75px;

            background:
                linear-gradient(
                    135deg,
                    #121a32,
                    #293760
                );
        }

        .game-info {
            padding: 22px;
        }

        .game-info h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .game-info p {
            color: #929dbc;
            margin-bottom: 20px;
        }

        .play-btn {
            width: 100%;
            border: none;
            border-radius: 12px;

            padding: 13px;

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00aaff,
                    #694cff
                );

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.03);

            box-shadow:
                0 10px 30px rgba(
                    50,
                    150,
                    255,
                    0.35
                );
        }

        /* =========================
           GAME PAGE
        ========================= */

        #gamePage {
            display: none;

            width: 94%;
            max-width: 1450px;

            margin: auto;
            padding: 25px 0 40px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            flex-wrap: wrap;

            margin-bottom: 15px;
        }

        .game-title {
            font-size: 27px;
            font-weight: bold;
        }

        .game-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            border: 1px solid #344263;

            background: #151d34;
            color: white;

            padding: 10px 15px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }

        .control-btn:hover {
            background: #263252;
        }

        .back-btn {
            background:
                linear-gradient(
                    135deg,
                    #ff4757,
                    #d63031
                );

            border: none;
        }

        .game-frame {
            width: 100%;
            height: 76vh;
            min-height: 500px;

            background: black;

            border-radius: 18px;

            overflow: hidden;

            border: 1px solid #303b5c;

            box-shadow:
                0 20px 70px rgba(
                    0,
                    0,
                    0,
                    0.5
                );
        }

        iframe {
            width: 100%;
            height: 100%;

            border: none;

            background: white;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 30px;

            color: #66718e;

            border-top:
                1px solid #1c2540;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding-top: 45px;
            }

            header h1 {
                font-size: 35px;
            }

            .logo {
                font-size: 50px;
            }

            .game-frame {
                height: 70vh;
                min-height: 400px;
            }

            .game-title {
                font-size: 21px;
            }
        }

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }

        }
    </style>
</head>


<body>


<!-- ==================================================
     HOME PAGE
================================================== -->

<div id="homePage">

    <header>

        <div class="logo">
            🎮
        </div>

        <h1>
            RAM GAMES
        </h1>

        <p>
            بازی‌های ساخته شده توسط RAM
        </p>

    </header>


    <main class="container">

        <h2 class="section-title">
            🎮 بازی‌ها
        </h2>


        <div class="games">


            <!-- GAME 1 -->

            <div class="game-card">

                <div class="game-cover">
                    🧙
                </div>

                <div class="game-info">

                    <h3>
                        GAME FOR KASRA
                    </h3>

                    <p>
                        یک بازی مخصوص کسرا
                    </p>

                    <button
                        class="play-btn"
                        onclick="openGame(
                            'GAME FOR KASRA.html',
                            'GAME FOR KASRA'
                        )"
                    >
                        ▶ بازی کردن
                    </button>

                </div>

            </div>



            <!-- GAME 2 -->

            <div class="game-card">

                <div class="game-cover">
                    🐱
                </div>

                <div class="game-info">

                    <h3>
                        Jelly Cat
                    </h3>

                    <p>
                        Jelly Cat Adventure
                    </p>

                    <button
                        class="play-btn"
                        onclick="openGame(
                            'Jelly cat.html',
                            'Jelly Cat'
                        )"
                    >
                        ▶ بازی کردن
                    </button>

                </div>

            </div>



            <!-- GAME 3 -->

            <div class="game-card">

                <div class="game-cover">
                    ⛏️
                </div>

                <div class="game-info">

                    <h3>
                        MINECRAFT RUN
                    </h3>

                    <p>
                        Minecraft Run
                    </p>

                    <button
                        class="play-btn"
                        onclick="openGame(
                            'MINECRAFT RUN.html',
                            'Minecraft Run'
                        )"
                    >
                        ▶ بازی کردن
                    </button>

                </div>

            </div>



            <!-- GAME 4 -->

            <div class="game-card">

                <div class="game-cover">
                    🖱️
                </div>

                <div class="game-info">

                    <h3>
                        Minecraft Click
                    </h3>

                    <p>
                        یک بازی کلیکی
                    </p>

                    <button
                        class="play-btn"
                        onclick="openGame(
                            'Minecraft Click.html',
                            'Minecraft Click'
                        )"
                    >
                        ▶ بازی کردن
                    </button>

                </div>

            </div>



            <!-- GAME 5 -->

            <div class="game-card">

                <div class="game-cover">
                    🏎️
                </div>

                <div class="game-info">

                    <h3>
                        MMO RACE
                    </h3>

                    <p>
                        مسابقه‌ای هیجان‌انگیز
                    </p>

                    <button
                        class="play-btn"
                        onclick="openGame(
                            '☁️ MMO RACE ☁️.html',
                            'MMO RACE'
                        )"
                    >
                        ▶ بازی کردن
                    </button>

                </div>

            </div>


        </div>

    </main>


    <footer>

        ساخته شده با ❤️ توسط RAM

    </footer>

</div>



<!-- ==================================================
     GAME PAGE
================================================== -->

<section id="gamePage">


    <div class="game-header">

        <div
            class="game-title"
            id="gameTitle"
        >
            🎮 بازی
        </div>


        <div class="game-buttons">

            <button
                class="control-btn back-btn"
                onclick="goHome()"
            >
                ↩ بازگشت
            </button>


            <button
                class="control-btn"
                onclick="openNewTab()"
            >
                ↗ باز کردن در تب جدید
            </button>


            <button
                class="control-btn"
                onclick="fullscreenGame()"
            >
                ⛶ تمام صفحه
            </button>

        </div>

    </div>


    <div class="game-frame">

        <iframe
            id="gameFrame"
            allowfullscreen
            allow="fullscreen"
        ></iframe>

    </div>

</section>



<script>

    let currentGame = "";


    /* ================================================
       OPEN GAME INSIDE WEBSITE
    ================================================= */

    function openGame(file, title) {

        currentGame = file;


        document.getElementById(
            "homePage"
        ).style.display = "none";


        document.getElementById(
            "gamePage"
        ).style.display = "block";


        document.getElementById(
            "gameTitle"
        ).textContent = "🎮 " + title;


        document.getElementById(
            "gameFrame"
        ).src = encodeURI(file);


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    /* ================================================
       BACK TO HOME
    ================================================= */

    function goHome() {

        document.getElementById(
            "gameFrame"
        ).src = "";


        document.getElementById(
            "gamePage"
        ).style.display = "none";


        document.getElementById(
            "homePage"
        ).style.display = "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    /* ================================================
       OPEN GAME IN NEW TAB
    ================================================= */

    function openNewTab() {

        if (!currentGame) {
            return;
        }


        window.open(
            encodeURI(currentGame),
            "_blank"
        );

    }



    /* ================================================
       FULLSCREEN
    ================================================= */

    function fullscreenGame() {

        const frame =
            document.getElementById(
                "gameFrame"
            );


        if (frame.requestFullscreen) {

            frame.requestFullscreen();

        }

        else if (
            frame.webkitRequestFullscreen
        ) {

            frame.webkitRequestFullscreen();

        }

    }

</script>


</body>

</html>
