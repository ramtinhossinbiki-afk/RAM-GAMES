<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAM GAMES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f6;color:#2d2a26;font-family:Tahoma,Arial,sans-serif}
.page{width:calc(100% - 34px);max-width:1500px;margin:17px auto;background:#fff;border:1px solid #f0dfc2;border-radius:28px;padding:28px;min-height:calc(100vh - 34px);box-shadow:0 10px 35px #c28a1a12}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.brand h1{margin:0;color:#c47d0d;font-size:40px}.brand p{margin:7px 0 0;color:#a9916d;font-size:14px}
button{font-family:inherit;cursor:pointer}
.admin-btn,.action{border:1px solid #e8d2aa;background:#fffaf1;color:#b86f09;border-radius:12px;padding:10px 16px}
.admin-btn:hover,.action:hover{background:#fff0d5}
.games-title{color:#c47d0d;margin:8px 0 20px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:20px}
.card{background:#fffdfa;border:1px solid #eedfc8;border-radius:20px;overflow:hidden;transition:.2s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #a66d1414}
.cover{height:165px;background:linear-gradient(135deg,#fff8e9,#f8ead0);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.noimg{display:flex;align-items:center;justify-content:center;color:#c47d0d;font-size:22px;font-weight:bold}
.content{padding:18px}.content h2{margin:0 0 8px;color:#a96508;font-size:19px}.content p{margin:0 0 15px;color:#8f887d;font-size:13px;min-height:38px}
.play{width:100%;padding:11px;border:0;border-radius:11px;background:#c47d0d;color:white}.play:hover{background:#a96808}
.badge{position:absolute;top:10px;right:10px;background:#202020dd;color:white;padding:6px 9px;border-radius:9px;font-size:11px}
.disabled{filter:grayscale(.8);opacity:.62}.disabled .play{background:#777;cursor:not-allowed}
#gamePage,#adminPage{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.game-name{font-size:27px;font-weight:bold;color:#c47d0d}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.back{background:#c47d0d;color:#fff;border-color:#c47d0d}
.game-box{height:78vh;min-height:480px;border:1px solid #ead9ba;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 35px #a66d1410}
iframe{display:block;width:100%;height:100%;border:0;background:#fff;outline:none}
.tip{text-align:center;color:#9a907f;font-size:12px;padding:9px}
.panel{background:#fffdfa;border:1px solid #eedfc8;border-radius:20px;padding:22px}
.panel h2{color:#b86f09;margin-top:0}
.form{display:grid;gap:10px;max-width:520px}.form input,.game-admin input{padding:12px;border:1px solid #e4d5bd;border-radius:10px;font:inherit}
.primary{background:#c47d0d;color:#fff;border:0;border-radius:10px;padding:11px 16px}
.admin-games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}
.game-admin{border:1px solid #eadcc7;border-radius:14px;padding:14px;background:#fff}
.game-admin h3{margin:0 0 10px;color:#9e620a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{padding:8px 11px;border-radius:9px;border:1px solid #dfcda9;background:#fff8eb;color:#8d5a09}
footer{margin-top:30px;padding-top:18px;border-top:1px solid #f0e5d2;text-align:center;color:#a79c8b;font-size:12px}
@media(max-width:650px){.page{width:calc(100% - 14px);margin:7px auto;padding:18px;border-radius:20px}header{align-items:flex-start;flex-direction:column}.brand h1{font-size:30px}.game-box{height:72vh;min-height:400px}}
</style>
</head>
<body>
<div class="page">

<section id="homePage">
<header>
  <div class="brand"><h1>RAM GAMES</h1><p>مجموعه بازی‌های RAM</p></div>
  <button class="admin-btn" onclick="adminOpen()">مدیریت بازی‌ها</button>
</header>
<h2 class="games-title">بازی‌ها</h2>
<div id="games" class="games"></div>
<footer>RAM GAMES — ساخته شده توسط RAM</footer>
</section>

<section id="gamePage">
  <div class="top">
    <div id="gameName" class="game-name">GAME</div>
    <div class="actions">
      <button class="action back" onclick="goHome()">بازگشت</button>
      <button class="action" onclick="openNewTab()">باز کردن در تب جدید</button>
      <button class="action" onclick="fullscreenGame()">تمام صفحه</button>
      <button class="action" onclick="focusGame()">فعال‌سازی کنترل</button>
    </div>
  </div>
  <div class="game-box" onclick="focusGame()">
    <iframe id="gameFrame" tabindex="0" allowfullscreen allow="fullscreen" onload="focusGame()"></iframe>
  </div>
  <div class="tip">برای بازی‌های کیبوردی، یک بار داخل صفحه بازی کلیک کن یا «فعال‌سازی کنترل» را بزن.</div>
</section>

<section id="adminPage">
  <div class="top">
    <h2 style="color:#c47d0d">مدیریت RAM GAMES</h2>
    <div class="actions">
      <button class="action back" onclick="goHome()">بازگشت</button>
      <button class="action" onclick="adminLogout()">خروج مدیر</button>
    </div>
  </div>
  <div id="adminContent"></div>
</section>

</div>

<script>
const games = [
 {name:"Halloween Hunt",file:"Halloween Hunt.html",img:"covers/cover1.jpg"},
 {name:"Glider",file:"Glider.html",img:"covers/cover2.jpg"},
 {name:"Doodle Jump",file:"Doodle Jump.html",img:"covers/cover3.jpg"},
 {name:"Cube 3D",file:"Cube 3D.html",img:"covers/cover4.jpg"},
 {name:"MMO RACE",file:"MMO RACE.html",img:"covers/cover5.jpg"},
 {name:"Jelly Cat",file:"Jelly cat.html",img:"covers/cover6.jpg"},
 {name:"Ball Climb",file:"Ball Climb.html",img:"covers/cover7.jpg"},
 {name:"Minecraft Click",file:"Minecraft Click.html",img:"covers/cover8.jpg"},
 {name:"GAME FOR KASRA",file:"GAME FOR KASRA.html",img:""},
 {name:"Minecraft Run",file:"MINECRAFT RUN.html",img:""},
 {name:"Blox Flip",file:"Blox Flip.html",img:""}
];

let currentGame="";
let settings=JSON.parse(localStorage.getItem("ramGamesSettings")||"{}");
let admin=JSON.parse(localStorage.getItem("ramGamesAdmin")||"null");
let sessionAdmin=localStorage.getItem("ramGamesSession")==="1";

function save(){localStorage.setItem("ramGamesSettings",JSON.stringify(settings));}

function isDisabled(i){return settings[i]?.disabled===true}
function isLocked(i){return !!settings[i]?.lock}

function renderGames(){
 const box=document.getElementById("games"); box.innerHTML="";
 games.forEach((g,i)=>{
  const disabled=isDisabled(i), locked=isLocked(i);
  const card=document.createElement("div");
  card.className="card"+(disabled?" disabled":"");
  card.innerHTML=`
   ${locked&&!disabled?'<div class="badge">قفل شده</div>':''}
   ${disabled?'<div class="badge">خارج از دسترس</div>':''}
   <div class="cover ${g.img?'':'noimg'}">${g.img?`<img src="${g.img}" alt="">`:g.name}</div>
   <div class="content">
    <h2>${g.name}</h2>
    <p>${disabled?"این بازی فعلاً در دسترس نیست":locked?"برای اجرای این بازی رمز لازم است":"برای اجرای بازی روی دکمه زیر بزن."}</p>
    <button class="play" onclick="tryOpen(${i})">${disabled?"در دسترس نیست":locked?"ورود با رمز":"بازی کردن"}</button>
   </div>`;
  box.appendChild(card);
 });
}

function tryOpen(i){
 if(isDisabled(i)){alert("این بازی فعلاً توسط مدیر از دسترس خارج شده است.");return}
 if(isLocked(i)){
   const p=prompt("رمز این بازی را وارد کنید:");
   if(p===null)return;
   if(p!==settings[i].lock){alert("رمز اشتباه است.");return}
 }
 openGame(i);
}

function openGame(i){
 currentGame=games[i].file;
 document.getElementById("homePage").style.display="none";
 document.getElementById("adminPage").style.display="none";
 document.getElementById("gamePage").style.display="block";
 document.getElementById("gameName").textContent=games[i].name;
 const f=document.getElementById("gameFrame");
 f.src=encodeURI(currentGame);
 window.scrollTo({top:0,behavior:"smooth"});
 setTimeout(focusGame,300);
}

function focusGame(){
 const f=document.getElementById("gameFrame");
 if(!f)return;
 try{f.focus(); f.contentWindow.focus();}catch(e){}
}

function goHome(){
 document.getElementById("gameFrame").src="";
 document.getElementById("gamePage").style.display="none";
 document.getElementById("adminPage").style.display="none";
 document.getElementById("homePage").style.display="block";
 currentGame="";
 renderGames();
 window.scrollTo({top:0,behavior:"smooth"});
}

function openNewTab(){if(currentGame)window.open(encodeURI(currentGame),"_blank")}
function fullscreenGame(){
 const f=document.getElementById("gameFrame");
 if(f.requestFullscreen)f.requestFullscreen();
 else if(f.webkitRequestFullscreen)f.webkitRequestFullscreen();
}

function adminOpen(){
 if(sessionAdmin){renderAdmin();return}
 if(!admin){
   const name=prompt("نام مدیر:");
   if(!name)return;
   const email=prompt("ایمیل مدیر:");
   if(!email)return;
   const pass=prompt("رمز مدیر:");
   if(!pass)return;
   admin={name,email,pass};
   localStorage.setItem("ramGamesAdmin",JSON.stringify(admin));
   sessionAdmin=true; localStorage.setItem("ramGamesSession","1");
   alert("حساب مدیر ساخته شد. این اولین حساب مدیر این مرورگر است.");
   renderAdmin();
 }else{
   const email=prompt("ایمیل مدیر:");
   const pass=prompt("رمز مدیر:");
   if(email===admin.email && pass===admin.pass){
     sessionAdmin=true; localStorage.setItem("ramGamesSession","1"); renderAdmin();
   }else alert("اطلاعات مدیر اشتباه است.");
 }
}

function renderAdmin(){
 document.getElementById("homePage").style.display="none";
 document.getElementById("gamePage").style.display="none";
 document.getElementById("adminPage").style.display="block";
 const c=document.getElementById("adminContent");
 c.innerHTML=`<div class="panel">
 <h2>کنترل بازی‌ها</h2>
 <p style="color:#8f887d">هر بازی را می‌توانی قفل کنی یا موقتاً از دسترس خارج کنی.</p>
 <div class="admin-games" id="adminGames"></div>
 </div>`;
 const list=document.getElementById("adminGames");
 games.forEach((g,i)=>{
  const d=document.createElement("div"); d.className="game-admin";
  const locked=isLocked(i), disabled=isDisabled(i);
  d.innerHTML=`<h3>${g.name}</h3>
   <div class="row">
    <button onclick="setLock(${i})">${locked?"تغییر رمز":"قفل کردن"}</button>
    ${locked?`<button onclick="unlockGame(${i})">برداشتن قفل</button>`:""}
    <button onclick="toggleDisabled(${i})">${disabled?"فعال کردن":"خارج کردن از دسترس"}</button>
   </div>`;
  list.appendChild(d);
 });
}

function setLock(i){
 const p=prompt("رمز جدید بازی را وارد کن:");
 if(!p)return;
 settings[i]={...(settings[i]||{}),lock:p};
 save(); renderAdmin(); renderGames();
}
function unlockGame(i){
 if(confirm("قفل این بازی برداشته شود؟")){
  settings[i]={...(settings[i]||{})}; delete settings[i].lock; save(); renderAdmin(); renderGames();
 }
}
function toggleDisabled(i){
 settings[i]={...(settings[i]||{}),disabled:!isDisabled(i)};
 save(); renderAdmin(); renderGames();
}
function adminLogout(){
 sessionAdmin=false; localStorage.removeItem("ramGamesSession"); goHome();
}

renderGames();
</script>
</body>
</html>
